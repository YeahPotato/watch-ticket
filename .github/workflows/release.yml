name: Release

# 推 v* tag 触发（如 v0.1.0）。打包 sidecar + Windows msi 并挂到 Release，
# 同步生成 latest.json 供 tauri-plugin-updater 使用。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            python-sidecar/requirements.txt
            python-sidecar/requirements-build.txt

      - name: Install Python sidecar deps
        working-directory: python-sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-build.txt

      - name: Build Python sidecar (PyInstaller onedir)
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: python python-sidecar/build.py

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & release Tauri (Windows msi)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # 让 WiX light.exe 的原始 stderr 打到 job 日志里，便于定位 LGHT0xxx
          RUST_LOG: debug
          RUST_BACKTRACE: "1"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WatchTicket ${{ github.ref_name }}"
          releaseBody: "自动构建。详见 CHANGELOG / commit。"
          releaseDraft: false
          prerelease: false
          args: --bundles msi --verbose

      # 即使 tauri build 失败也上传 WiX 中间产物，便于排查 light.exe 报错
      - name: Upload WiX intermediates on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wix-debug
          path: |
            src-tauri/target/release/wix/**/*
            src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 7
